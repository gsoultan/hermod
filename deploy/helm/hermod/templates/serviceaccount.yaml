{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermod.serviceAccountName" . }}
  labels:
    {{- include "hermod.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Hermod does not talk to the Kubernetes API, so it has no use for a token.
automountServiceAccountToken: false
{{- end }}
