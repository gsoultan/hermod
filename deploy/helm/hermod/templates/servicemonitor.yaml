{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hermod.fullname" . }}
  labels:
    {{- include "hermod.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "hermod.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if or .Values.metrics.token .Values.metrics.existingTokenSecret }}
      # Without this the scrape gets a 401 and the metrics silently stop, which
      # takes the four silent-failure alerts down with them.
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.existingTokenSecret | default (include "hermod.fullname" .) }}
          key: {{ .Values.metrics.existingTokenSecretKey }}
      {{- end }}
{{- end }}
