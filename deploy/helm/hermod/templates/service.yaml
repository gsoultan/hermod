apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermod.fullname" . }}
  labels:
    {{- include "hermod.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP by default and deliberately: /metrics is unauthenticated, so a
  # LoadBalancer here would publish workflow names and counts to the internet.
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "hermod.selectorLabels" . | nindent 4 }}
