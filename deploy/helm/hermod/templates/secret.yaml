{{- if and (not .Values.existingSecret) (or .Values.masterKey .Values.database.connection) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermod.fullname" . }}
  labels:
    {{- include "hermod.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.masterKey }}
  # Encrypts every stored connector credential. Rotating this alone is not
  # enough -- go through PUT /api/config/crypto, which re-encrypts what is
  # already stored. Replacing the value here leaves existing credentials
  # encrypted under a key the process no longer has.
  {{ $.Values.existingSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.connection }}
  dbConnection: {{ . | quote }}
  {{- end }}
{{- end }}
