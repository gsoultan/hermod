version: 2
project_name: hermod

before:
  hooks:
    - go mod tidy
    - go run ./cmd/hermod --build-ui --mode build-only

builds:
  - id: hermod
    main: ./cmd/hermod
    binary: hermod
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X "github.com/gsoultan/hermod/internal/version.Version={{.Tag}} (Enterprise Edition)"

  - id: hermod-edge
    main: ./cmd/hermod-edge
    binary: hermod-edge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X "github.com/gsoultan/hermod/internal/version.Version={{.Tag}} (Enterprise Edition)"

  - id: hermodctl
    main: ./cmd/hermodctl
    binary: hermodctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X "github.com/gsoultan/hermod/internal/version.Version={{.Tag}} (Enterprise Edition)"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/gsoultan/hermod
    maintainer: Hermod Team <support@hermod.io>
    description: Enterprise-Grade Data Integration & Streaming Platform
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # Mark a release candidate as a pre-release, so GitHub does not label it
  # "Latest" and offer it as the thing to download.
  #
  # It did exactly that before: v1.7.3-rc.1 was published with
  # prerelease=false, because goreleaser's default is false rather than auto
  # and nothing here overrode it. That tag happened to be superseded by v1.7.3
  # within the hour, so nobody saw it holding the "Latest" badge -- an RC that
  # is not followed quickly would have kept it, which is the whole thing an RC
  # exists to avoid saying.
  #
  # `auto` reads the tag: anything with a pre-release part (-rc.1, -beta.2) is
  # marked, a plain vX.Y.Z is not.
  prerelease: auto
