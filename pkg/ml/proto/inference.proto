syntax = "proto3";

package hermod.ml.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gsoultan/hermod/pkg/ml/proto";

// InferenceService runs rows through a model registered in a Hermod vhost.
//
// It is the gRPC twin of POST /api/ml/serve/{vhost}/{name}: the same models,
// the same serving keys and the same answers. A model is callable only once an
// Editor has made a serving key for it; send that key as "x-api-key" metadata.
service InferenceService {
  // Predict sends a batch of rows to the model and returns one prediction per
  // row, in order. At most 1000 rows per call.
  //
  // Errors: UNAUTHENTICATED for a missing or wrong key, or a model without
  // serving turned on (the same answer for each, so the service does not say
  // which models exist); INVALID_ARGUMENT for no rows or too many;
  // UNAVAILABLE when the model server could not answer.
  rpc Predict(PredictRequest) returns (PredictResponse);

  // Recommend asks a recommendation model for a person's top items, or for
  // the items most like one item. It is the gRPC twin of a serve call with
  // {"user"} or {"item"}. A person or item the model does not know gets the
  // most popular items, each with reason "popular", so the answer is never
  // empty.
  //
  // Errors: UNAUTHENTICATED as for Predict; INVALID_ARGUMENT for no user or
  // item, a negative k, exclude_seen with an item, or a model that predicts
  // rows; RESOURCE_EXHAUSTED over the vhost's quota; UNAVAILABLE when the
  // model could not be loaded.
  rpc Recommend(RecommendRequest) returns (RecommendResponse);

  // RecommendScenario asks a scenario recommendation model (visits,
  // products, reorder, audience or similar) for its answer: the gRPC twin of
  // POST /api/ml/serve/{vhost}/{name}/recommend, with the same fields. Each
  // answer carries a recommendation_id to send feedback with.
  //
  // Errors: UNAUTHENTICATED as for Predict; INVALID_ARGUMENT for a subject
  // the scenario does not take, a bad period, within_days, k or rule, a
  // segment, size, price_tier, channel or region for a list that is not of
  // customers or a model without them, a rule that loosens the model's own
  // rules, more than 1000 customers, or a model without a scenario;
  // RESOURCE_EXHAUSTED over the vhost's quota; UNAVAILABLE when the model
  // could not be loaded.
  rpc RecommendScenario(RecommendScenarioRequest) returns (RecommendScenarioResponse);

  // SubmitJob queues a Predict or Recommend call as a job and returns at
  // once. It is the gRPC twin of a serve call with "respond": "async". A
  // prediction job takes up to 50000 rows, sent to the model in calls the
  // vhost's quota lets through. Read the job with GetJob or WatchJob; it and
  // its result are kept for 7 days.
  //
  // Errors: UNAUTHENTICATED as for Predict; INVALID_ARGUMENT for a call
  // Predict or Recommend would refuse in itself, or a callback_url that is not
  // a public http or https URL; FAILED_PRECONDITION for a callback_url when
  // the vhost holds no ML_CALLBACK_SECRET; RESOURCE_EXHAUSTED when the vhost
  // has too many jobs waiting.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // GetJob returns a job submitted with the same model's serving key, with
  // its result once it has one.
  //
  // Errors: UNAUTHENTICATED for no key; NOT_FOUND for a job that does not
  // exist or was not submitted with this model's serving key (the same
  // answer for each).
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // CancelJob cancels a queued job at once, and stops a running one within
  // seconds. A finished job is returned as it is. Errors as for GetJob.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // WatchJob sends the job now, again each time its status or progress
  // changes, and ends after sending it finished. Errors as for GetJob.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
}

message SubmitJobRequest {
  // The call to run as a job. Its vhost and model are the job's.
  oneof call {
    PredictRequest predict = 1;
    RecommendRequest recommend = 2;
  }
  // An http or https URL Hermod posts the finished job to, signed with the
  // vhost's ML_CALLBACK_SECRET. Optional.
  string callback_url = 3;
}

message SubmitJobResponse {
  // The job, queued.
  Job job = 1;
}

message GetJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id, as SubmitJob returned it.
  string job_id = 2;
}

message GetJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id.
  string job_id = 2;
}

message CancelJobResponse {
  // The job after cancelling: cancelled, or running with
  // cancel_requested set until it stops.
  Job job = 1;
}

message WatchJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id.
  string job_id = 2;
}

message WatchJobResponse {
  Job job = 1;
}

// Job is an asynchronous call: where it stands and, once it succeeded, what
// the call answered.
message Job {
  string id = 1;
  string vhost = 2;
  string model = 3;
  // "predict", "recommend" or "train".
  string kind = 4;
  // "queued", "running", "succeeded", "failed" or "cancelled".
  string status = 5;
  // How far along the job is, from 0 to 1, and the same in words.
  double progress = 6;
  string progress_message = 7;
  // Why the job failed, in words; empty otherwise.
  string error = 8;
  // Set once cancelling a running job was asked for, until it stops.
  bool cancel_requested = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  // When the job and its result are removed.
  google.protobuf.Timestamp expires_at = 13;
  // The answer of a succeeded job: what Predict or Recommend would have
  // returned, or RecommendScenario for a scenario call sent with
  // "respond": "async" to POST /api/ml/serve/{vhost}/{name}/recommend.
  // Unset until then.
  oneof result {
    PredictResponse predict_result = 14;
    RecommendResponse recommend_result = 15;
    RecommendScenarioResponse recommend_scenario_result = 16;
  }
}

message RecommendScenarioRequest {
  // The vhost the model belongs to.
  string vhost = 1;
  // The model's name in that vhost.
  string model = 2;
  // Who or what the answer is for: the JSON call's "for". Set the one the
  // model's scenario takes: salesman for visits, customer (or customers) for
  // products and reorder, product for audience and similar.
  ScenarioSubject subject = 3;
  // A visit plan's first day, YYYY-MM-DD; today when empty.
  string period_from = 4;
  // A visit plan's last day, YYYY-MM-DD; the model's period from
  // period_from when empty.
  string period_to = 5;
  // Results per subject: the model's default when 0.
  int32 k = 6;
  // Rules for this call, each as JSON gives it ({"kind": "exclude", ...}).
  // They may only tighten the model's own rules.
  repeated google.protobuf.Struct rules = 7;
  // Whether to leave out products the customer already bought; the model's
  // default when unset.
  optional bool exclude_seen = 8;
  // For reorder: only the customers due to order within this many days
  // from today (1 to 366), overdue ones included and marked, most likely
  // first. 0 is no window.
  int32 within_days = 9;
  // Stock on hand now, by product id: it replaces the stock the model was
  // trained with for those products, so one out of stock (0 or less) is not
  // recommended (its substitute is offered instead) and has no audience. Up
  // to 10000 products; only models trained with a products stock column use
  // it.
  map<string, double> stock = 10;
}

message ScenarioSubject {
  string customer = 1;
  // Up to 1000 customers in one call: one result each.
  repeated string customers = 2;
  // For reorder, the customers who buy this product again and again.
  string product = 3;
  string salesman = 4;
  // The territory a rule's from_request "territory" binds to.
  string territory = 5;
  // For reorder: every customer, in one result.
  bool all_customers = 6;
  // For a list of customers (visits, reorder, audience): only the customers
  // of this category, as the model's customers.segment holds it, in any case.
  string segment = 7;
  // For a list of customers: only the customers of this size, "small",
  // "medium" or "large" (or the model's own size labels), or a number the
  // model buckets as its training cut its customers' sizes.
  string size = 8;
  // For a list of products (products, reorder for a customer, similar):
  // only the products of this brand, as the model's products.brand holds it,
  // in any case.
  string brand = 9;
  // For a list of products: only the products of this subcategory, as the
  // model's products.subcategory holds it, in any case.
  string subcategory = 10;
  // For a list of customers: only the customers of this price tier, as the
  // model's customers.price_tier holds it, in any case.
  string price_tier = 11;
  // For a list of customers: only the customers of this channel, as the
  // model's customers.channel holds it, in any case.
  string channel = 12;
  // For a list of customers: only the customers of this region, as the
  // model's customers.region holds it, in any case.
  string region = 13;
}

message RecommendScenarioResponse {
  // The model that answered.
  string model = 1;
  // The id feedback on this answer is sent with.
  string recommendation_id = 2;
  // One result per subject, in the order asked.
  repeated ScenarioResult results = 3;
}

message ScenarioResult {
  // The subject's id: the JSON answer's "for".
  string subject = 1;
  // Best first.
  repeated ScenarioPick items = 2;
  // A visit plan's days, in order; empty for other scenarios.
  repeated PlanDay plan = 3;
  // For a customer's products: what nearby customers of its category buy,
  // in a line, such as "Minimarket customers within 5 km buy: A, B, C";
  // empty otherwise.
  string summary = 4;
}

message ScenarioPick {
  string id = 1;
  double score = 2;
  int32 rank = 3;
  repeated Reason reasons = 4;
  // The item's own fields from the model's data (name, territory, ...).
  google.protobuf.Struct fields = 5;
  // For reorder: when the customer is due to order it, YYYY-MM-DD.
  string due_date = 6;
  // For reorder: due_date has passed with no order since.
  bool overdue = 7;
  // For reorder: the products the customer is due to buy again, soonest
  // first: those due within the window, or the one product asked about.
  repeated DueProduct products = 8;
}

// A product a reorder customer is due to buy again.
message DueProduct {
  string id = 1;
  // YYYY-MM-DD, from the customer's own gap between buying it.
  string due_date = 2;
  // due_date has passed.
  bool overdue = 3;
  // The product's own fields from the model's data (name, category).
  google.protobuf.Struct fields = 4;
}

message Reason {
  // A stable code, such as "overdue" or "bought_together".
  string code = 1;
  // The reason in words.
  string text = 2;
}

message PlanDay {
  // YYYY-MM-DD.
  string date = 1;
  // That day's visits, in route order.
  repeated ScenarioPick items = 2;
}

message RecommendRequest {
  // The vhost the model belongs to.
  string vhost = 1;
  // The model's name in that vhost.
  string model = 2;
  // Who or what to recommend for: ids as text, as the training data held
  // them ("1000" for a numeric id 1000).
  oneof subject {
    // A person: their top items.
    string user = 3;
    // An item: the items most like it.
    string item = 4;
  }
  // How many items: 10 when 0, at most 100.
  int32 k = 5;
  // For a user, whether to leave out items they already had. True when
  // unset. Not allowed with an item.
  optional bool exclude_seen = 6;
}

message RecommendResponse {
  // The model that answered.
  string model = 1;
  // Best first.
  repeated RecommendedItem items = 2;
  // The id feedback on this answer is sent with.
  string recommendation_id = 3;
}

message RecommendedItem {
  // The item's id.
  string item = 1;
  // The model's score: higher is a stronger recommendation. Scores compare
  // only within one answer.
  double score = 2;
  // "popular" when the item comes from the popular fallback; empty otherwise.
  string reason = 3;
}

message PredictRequest {
  // The vhost the model belongs to.
  string vhost = 1;
  // The model's name in that vhost.
  string model = 2;
  // One object per row, with the fields the model takes.
  repeated google.protobuf.Struct instances = 3;
}

message PredictResponse {
  // The model that answered.
  string model = 1;
  // One object per row of the request, in the same order. A model with a
  // single output answers {"prediction": value}.
  repeated google.protobuf.Struct predictions = 2;
}
