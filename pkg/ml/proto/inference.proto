syntax = "proto3";

package hermod.ml.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gsoultan/hermod/pkg/ml/proto";

// InferenceService runs rows through a model registered in a Hermod vhost.
//
// It is the gRPC twin of POST /api/ml/serve/{vhost}/{name}: the same models,
// the same serving keys and the same answers. A model is callable only once an
// Editor has made a serving key for it; send that key as "x-api-key" metadata.
service InferenceService {
  // Predict sends a batch of rows to the model and returns one prediction per
  // row, in order. At most 1000 rows per call.
  //
  // Errors: UNAUTHENTICATED for a missing or wrong key, or a model without
  // serving turned on (the same answer for each, so the service does not say
  // which models exist); INVALID_ARGUMENT for no rows or too many;
  // UNAVAILABLE when the model server could not answer.
  rpc Predict(PredictRequest) returns (PredictResponse);

  // Recommend asks a recommendation model for a person's top items, or for
  // the items most like one item. It is the gRPC twin of a serve call with
  // {"user"} or {"item"}. A person or item the model does not know gets the
  // most popular items, each with reason "popular", so the answer is never
  // empty.
  //
  // Errors: UNAUTHENTICATED as for Predict; INVALID_ARGUMENT for no user or
  // item, a negative k, exclude_seen with an item, or a model that predicts
  // rows; RESOURCE_EXHAUSTED over the vhost's quota; UNAVAILABLE when the
  // model could not be loaded.
  rpc Recommend(RecommendRequest) returns (RecommendResponse);

  // SubmitJob queues a Predict or Recommend call as a job and returns at
  // once. It is the gRPC twin of a serve call with "respond": "async". A
  // prediction job takes up to 50000 rows, sent to the model in calls the
  // vhost's quota lets through. Read the job with GetJob or WatchJob; it and
  // its result are kept for 7 days.
  //
  // Errors: UNAUTHENTICATED as for Predict; INVALID_ARGUMENT for a call
  // Predict or Recommend would refuse in itself, or a callback_url that is not
  // a public http or https URL; FAILED_PRECONDITION for a callback_url when
  // the vhost holds no ML_CALLBACK_SECRET; RESOURCE_EXHAUSTED when the vhost
  // has too many jobs waiting.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // GetJob returns a job submitted with the same model's serving key, with
  // its result once it has one.
  //
  // Errors: UNAUTHENTICATED for no key; NOT_FOUND for a job that does not
  // exist or was not submitted with this model's serving key (the same
  // answer for each).
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // CancelJob cancels a queued job at once, and stops a running one within
  // seconds. A finished job is returned as it is. Errors as for GetJob.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // WatchJob sends the job now, again each time its status or progress
  // changes, and ends after sending it finished. Errors as for GetJob.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
}

message SubmitJobRequest {
  // The call to run as a job. Its vhost and model are the job's.
  oneof call {
    PredictRequest predict = 1;
    RecommendRequest recommend = 2;
  }
  // An http or https URL Hermod posts the finished job to, signed with the
  // vhost's ML_CALLBACK_SECRET. Optional.
  string callback_url = 3;
}

message SubmitJobResponse {
  // The job, queued.
  Job job = 1;
}

message GetJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id, as SubmitJob returned it.
  string job_id = 2;
}

message GetJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id.
  string job_id = 2;
}

message CancelJobResponse {
  // The job after cancelling: cancelled, or running with
  // cancel_requested set until it stops.
  Job job = 1;
}

message WatchJobRequest {
  // The vhost the job belongs to.
  string vhost = 1;
  // The job's id.
  string job_id = 2;
}

message WatchJobResponse {
  Job job = 1;
}

// Job is an asynchronous call: where it stands and, once it succeeded, what
// the call answered.
message Job {
  string id = 1;
  string vhost = 2;
  string model = 3;
  // "predict", "recommend" or "train".
  string kind = 4;
  // "queued", "running", "succeeded", "failed" or "cancelled".
  string status = 5;
  // How far along the job is, from 0 to 1, and the same in words.
  double progress = 6;
  string progress_message = 7;
  // Why the job failed, in words; empty otherwise.
  string error = 8;
  // Set once cancelling a running job was asked for, until it stops.
  bool cancel_requested = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  // When the job and its result are removed.
  google.protobuf.Timestamp expires_at = 13;
  // The answer of a succeeded job: what Predict or Recommend would have
  // returned. Unset until then.
  oneof result {
    PredictResponse predict_result = 14;
    RecommendResponse recommend_result = 15;
  }
}

message RecommendRequest {
  // The vhost the model belongs to.
  string vhost = 1;
  // The model's name in that vhost.
  string model = 2;
  // Who or what to recommend for: ids as text, as the training data held
  // them ("1000" for a numeric id 1000).
  oneof subject {
    // A person: their top items.
    string user = 3;
    // An item: the items most like it.
    string item = 4;
  }
  // How many items: 10 when 0, at most 100.
  int32 k = 5;
  // For a user, whether to leave out items they already had. True when
  // unset. Not allowed with an item.
  optional bool exclude_seen = 6;
}

message RecommendResponse {
  // The model that answered.
  string model = 1;
  // Best first.
  repeated RecommendedItem items = 2;
}

message RecommendedItem {
  // The item's id.
  string item = 1;
  // The model's score: higher is a stronger recommendation. Scores compare
  // only within one answer.
  double score = 2;
  // "popular" when the item comes from the popular fallback; empty otherwise.
  string reason = 3;
}

message PredictRequest {
  // The vhost the model belongs to.
  string vhost = 1;
  // The model's name in that vhost.
  string model = 2;
  // One object per row, with the fields the model takes.
  repeated google.protobuf.Struct instances = 3;
}

message PredictResponse {
  // The model that answered.
  string model = 1;
  // One object per row of the request, in the same order. A model with a
  // single output answers {"prediction": value}.
  repeated google.protobuf.Struct predictions = 2;
}
