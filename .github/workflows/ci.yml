name: CI

on:
  push:
    # Only main. A branch with an open PR used to run everything twice — once
    # for push, once for pull_request — and the pair of ~15-minute jobs twice
    # over meant every push queued half an hour of duplicate work.
    branches: [main]
  pull_request:
  # Nightly: the integration E2E and soak jobs are too slow for every push but
  # too valuable to run only by hand.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A newer push supersedes the runs of the older one; let it cancel them. The
# nightly run groups by run_id so a schedule can never cancel anything.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && github.run_id || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  quick-verify:
    name: Verify (Go)
    runs-on: ubuntu-latest
    steps:
      # This job died three runs straight at the same step — ~2 minutes into
      # installing govulncheck — with "The runner has received a shutdown
      # signal", exit 143. Two of those were parallel runs on separate VMs
      # killed in lockstep, which rules out random eviction: the condition is
      # deterministic per VM. It is the disk. The job builds the whole tree
      # twice (plain and -race), fills the golangci-lint and staticcheck
      # caches, and the govulncheck install is simply the next write after
      # nothing is left — at which point the runner agent cannot even write
      # its own diagnostics, so it dies with the shutdown message instead of
      # the honest "No space left on device" the integration job showed.
      # Same remedy as there: drop toolchains this repository never uses.
      - name: Free disk space on the runner
        run: |
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') available"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') available"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # golangci-lint's new-from-merge-base needs the merge base in history.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Verify (vet)
        run: go vet ./...
      # Integration tests sit behind a build tag, so `go build` and the vet
      # above never look at them. Three of the five had stopped compiling —
      # a package rename applied by search-and-replace, an import left behind,
      # and a constructor that gained a parameter — which meant the worker
      # failover, lease-stealing and sink idempotency coverage had silently not
      # run for however long. Type-checking them costs seconds and needs none of
      # the services they talk to.
      - name: Verify (vet, integration-tagged)
        run: go vet -tags=integration ./...
      # The suite was previously absent from CI entirely, so a red test could
      # merge unnoticed. Race detection is on because the engine is concurrent.
      - name: Test (race)
        run: go test -race ./...
      # Gates new code only (see issues.new-from-merge-base in .golangci.yml).
      # The pre-existing backlog is reported by the nightly lint-debt job rather
      # than blocking every change.
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=10m
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      # The gRPC source's wire contract. CLAUDE.md has listed these two as
      # gates for some time, but there was no buf.yaml and neither had ever
      # run — so `hermod.source.grpc.v1 SourceService`, which external clients
      # call to push records in, could be changed in any way at all with
      # nothing objecting. See buf.yaml for why only that module is gated and
      # why one lint rule is excluded.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Buf lint
        run: buf lint
      # buf reads the comparison side by cloning .git, and a clone only carries
      # local branches. actions/checkout leaves the base as a remote-tracking ref
      # and HEAD detached, so refs/heads/<base> does not exist and buf fails with
      # "couldn't find remote ref" — an infrastructure error that looks nothing
      # like a breaking change. fetch-depth: 0 above gives us the objects; this
      # only gives the ref a local name buf can resolve.
      - name: Give buf a local ref to compare against
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          # On a push to the base branch itself, checkout is already on it and
          # git refuses to fetch into the current branch. Nothing to do there.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "$base" ]; then
            git fetch --no-tags --force origin "refs/heads/$base:refs/heads/$base"
          fi
      # Module-scoped on both sides. The bare form compares whole trees, and a
      # merge base predating buf.yaml has no module layout to compare against,
      # which reports every file as deleted rather than reporting a break.
      - name: Buf breaking
        run: |
          buf breaking pkg/comm/source/grpc/proto \
            --against ".git#branch=${{ github.event.pull_request.base.ref || github.event.repository.default_branch }},subdir=pkg/comm/source/grpc/proto"
  # Split out of Verify (Go) after four consecutive runs of that job died at
  # the govulncheck step with "the runner has received a shutdown signal". The
  # symbol-level scan peaks at 7–9GB resident (measured with /usr/bin/time -l)
  # and a private-repo runner has 7GB total, so the VM's OOM killer took the
  # runner agent itself — nothing in the log said memory, and two parallel
  # runs dying in lockstep at the same step is what gave it away as
  # deterministic. GOMEMLIMIT is not the fix: the live set really is that
  # large, so a soft limit just multiplied GC time by 15 while RSS grew anyway
  # (also measured). Swap is — it preserves the scan exactly and turns the
  # overshoot into slowness instead of a dead runner. The split additionally
  # takes the ~10-minute security tail off the Verify (Go) critical path.
  security-gates:
    name: Verify (security gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # security-check.sh runs golangci-lint, whose config ratchets with
          # new-from-merge-base: origin/main. A shallow clone has no merge
          # base, so the ratchet silently widens to the whole backlog and the
          # job fails on findings older than the branch.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The swapfile below takes 8G of a ~14G disk, and the golangci-lint
      # install then died at link time with 6MB free. Same cleanup as the
      # other jobs, and it has to come first: the freed space is what the
      # swapfile and the toolchain builds share.
      - name: Free disk space on the runner
        run: |
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') available"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') available"
      - name: Give the scan swap to overflow into
        run: |
          free -h | sed -n '1,3p'
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h | sed -n '1,3p'
      # Wrapper, not bare govulncheck: it records reviewed exemptions with the
      # reason each vulnerable path is unreachable, and still fails on anything
      # unexempted. A gate that is permanently red because of one unfixable
      # upstream advisory is a gate everyone learns to ignore.
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ./scripts/govulncheck.sh
      # security-check.sh shells out to golangci-lint by name (its static-
      # analysis step), and this job no longer inherits the binary from the
      # lint action next door. Same pinned version as Verify (Go) uses.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      # One command that runs every check backing a claim in SECURITY.md, so the
      # posture is verified per build rather than remembered. It re-runs a few
      # tests the main suite already covers; that is the point — the value is in
      # a single place that fails when a security claim stops being true, rather
      # than the claim quietly outliving its enforcement.
      - name: Security checks
        run: ./scripts/security-check.sh
      # dev.sh teardown has to reap processes that no longer hold a port; one
      # that survived a run for hours poisoned the next run's log with errors
      # from a database it was no longer using. --stop touches no container
      # runtime, so this is safe on a bare runner.
      - name: Dev script cleanup
        run: ./scripts/dev_cleanup_test.sh

  ui-verify:
    name: Verify (UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `tsc -b`, not `tsc --noEmit`: the root tsconfig is a solution file with
      # `files: []`, so --noEmit checks nothing and always passes.
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  e2e:
    name: E2E + layout audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd ui && bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      # SQLite keeps CI free of a database service. The script builds the
      # binary, starts API + UI, completes first-run setup and returns.
      - name: Start Hermod
        run: ./scripts/dev.sh --sqlite --reset --detach
      # Every spec here runs against the SQLite stack above and needs no
      # external service — which is now every spec there is. Anything needing
      # Postgres or RabbitMQ belongs in `integration-go`, driven directly
      # rather than through a browser; see the note above the `soak` job for
      # where the last such spec went.
      #
      # These used to be four hand-listed audits, and the eleven functional
      # specs ran nowhere. Nothing executed them, so nothing reported that they
      # had drifted: their login credentials went stale, several navigated to a
      # hardcoded localhost:5175 instead of the configured baseURL, and their
      # assertions no longer matched the UI. A spec that is not in CI is not
      # coverage.
      - name: E2E (no external services)
        run: |
          bunx playwright test \
            ui/__tests__/layout_audit.spec.ts \
            ui/__tests__/visual_audit.spec.ts \
            ui/__tests__/canvas_area_e2e.spec.ts \
            ui/__tests__/form_audit.spec.ts \
            ui/__tests__/transform_drawer_audit.spec.ts \
            ui/__tests__/core_scenarios_e2e.spec.ts \
            ui/__tests__/multi_pipeline_editor_e2e.spec.ts \
            ui/__tests__/workflow_surface_e2e.spec.ts \
            ui/__tests__/required_select_e2e.spec.ts \
            ui/__tests__/worker_e2e.spec.ts \
            ui/__tests__/no_token_in_storage_e2e.spec.ts \
            ui/__tests__/stream_auth_e2e.spec.ts
      - name: Stop Hermod
        if: always()
        run: ./scripts/dev.sh --stop
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audits
          path: |
            layout-audit.json
            form-audit.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Deployment artifacts.
  #
  # The image and the chart are only exercised at release time otherwise, which
  # is the worst moment to discover either is broken. Building the image on
  # every push also catches the failure mode the Dockerfile guards against: the
  # UI is embedded at compile time, so a binary built without the assets starts
  # happily and serves a blank page.
  deploy-artifacts:
    name: Image and chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Load rather than push, so the container can actually be run below.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hermod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image is not a working one. This is the same check the chart's
      # probes rely on, so if it fails here it would have failed as a
      # CrashLoopBackOff in a cluster.
      - name: Container starts and serves its probes
        run: |
          docker run -d --name hermod-ci -p 4000:4000 \
            -e HERMOD_CONFIG_DIR=/tmp/hermod hermod:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/livez >/dev/null 2>&1; then
              echo "livez OK after ${i}s"; break
            fi
            if [ "$i" = 60 ]; then
              echo "container never became live:"; docker logs hermod-ci; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:4000/readyz -o /dev/null -w 'readyz: %{http_code}\n' || true
          curl -fsS http://localhost:4000/metrics | head -1
          # The embedded UI: a blank page here is the failure this guards.
          curl -fsS http://localhost:4000/ | grep -qi "<!doctype html" \
            || { echo "the embedded UI did not render"; docker logs hermod-ci; exit 1; }

      - name: Container drains rather than being killed on SIGTERM
        run: |
          start=$(date +%s)
          docker stop --timeout 60 hermod-ci
          end=$(date +%s)
          echo "shutdown took $((end - start))s"
          # Exit 0 means it handled SIGTERM and left on its own terms; 137 is
          # SIGKILL, which is what happens when a drain overruns its budget.
          code=$(docker inspect hermod-ci --format '{{.State.ExitCode}}')
          test "$code" != "137" || { echo "container was SIGKILLed, not drained"; exit 1; }

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/hermod
          helm template t deploy/helm/hermod > /dev/null
          helm template t deploy/helm/hermod --set metrics.prometheusRule.enabled=true \
            --set metrics.serviceMonitor.enabled=true --set ingress.enabled=true > /dev/null

      # The chart must name the image this repository actually publishes.
      # v1.7.0 shipped with the default pointing at ghcr.io/user/hermod, taken
      # from the Go module path rather than the registry, so the chart
      # installed cleanly and then sat in ImagePullBackOff. Nothing caught it
      # because `helm template` renders a wrong image reference just as happily
      # as a right one.
      - name: Chart points at the image this repo publishes
        run: |
          expected="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          rendered=$(helm template t deploy/helm/hermod \
            | grep -oE 'image: "[^"]+"' | head -1 | sed -E 's/image: "(.*):.*"/\1/')
          echo "expected: $expected"
          echo "rendered: $rendered"
          test "$rendered" = "$expected" || {
            echo "The chart would pull an image this repository does not publish."
            exit 1
          }

      # The guards are the reason the chart exists. Each of these deploys
      # happily and loses data, so rendering must refuse them.
      - name: Chart refuses configurations that lose data
        run: |
          fails() {
            if helm template t deploy/helm/hermod "$@" >/dev/null 2>&1; then
              echo "FAIL: chart accepted: $*"; exit 1
            fi
            echo "ok, refused: $*"
          }
          fails --set terminationGracePeriodSeconds=20
          fails --set masterKey=abc --set existingSecret=s
          fails --set replicaCount=3
          fails --set replicaCount=3 --set database.type=postgres --set database.connectionSecret=dsn

      # The release tarball, not `go install`: the Prometheus module carries
      # replace directives, so `go install .../cmd/promtool@latest` refuses with
      # "must not contain directives that would cause it to be interpreted
      # differently than if it were the main module".
      - name: Validate the alert rules
        env:
          PROMETHEUS_VERSION: 3.13.2
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz
          promtool="./prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          "$promtool" --version
          helm template t deploy/helm/hermod --set metrics.prometheusRule.enabled=true \
            | scripts/extract-prometheus-rules.sh > /tmp/rules.yaml
          # Guard against the extraction silently producing nothing, which would
          # make promtool pass on an empty file and report no rules at all.
          test -s /tmp/rules.yaml
          "$promtool" check rules /tmp/rules.yaml | tee /tmp/promtool.out
          grep -q "SUCCESS: 4 rules found" /tmp/promtool.out

  # Go integration tests: real Postgres, no browser.
  #
  # This is where the data-plane coverage belongs. The Playwright specs below
  # tried to prove that a row changing in a source database arrives as a message
  # by driving the source wizard through a browser, and rotted the moment the
  # wizard was redesigned -- none of what they were really testing lives in the
  # DOM. Driving the source directly runs in seconds instead of minutes, does
  # not care what the form looks like, and points at replication rather than at
  # a button when it fails. So this job is required, and the browser one is not.
  integration-go:
    name: Integration (Go, real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: hermod_it
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # MySQL, Redis and Mongo were reachable by these tests from nobody: the
      # files compiled and were never executed, which is how a lease filter
      # that matched no document at all survived in the MongoDB backend.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hermod_it
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672
      # etcd, so the state store contract runs against all three of its
      # implementations rather than two. The etcd store was the last one whose
      # behaviour was taken on trust: the contract file existed and skipped on
      # every run, which reads as nine passing clauses in the log.
      #
      # No --health-cmd, deliberately. Docker runs a health command through
      # /bin/sh, and this image has no shell, so any --health-cmd never executes
      # and the service is reported as failed however healthy etcd is. The wait
      # step below uses etcd's own HTTP health endpoint from the runner instead.
      etcd:
        image: quay.io/coreos/etcd:v3.5.17
        env:
          ETCD_NAME: n1
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://0.0.0.0:2380
          ETCD_INITIAL_CLUSTER: n1=http://0.0.0.0:2380
          ETCD_INITIAL_CLUSTER_STATE: new
          ALLOW_NONE_AUTHENTICATION: "yes"
        ports:
          - 2379:2379
      # A mail catcher, so the SMTP sink's send path is exercised rather than
      # skipped. Its API lets the test read the message back: an SMTP server
      # accepts a message long before anyone can read it, so "Write returned
      # nil" is a weaker claim than it looks.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      # A broker, so the Kafka connectors are proven to move a record rather
      # than assumed to. KRaft mode, so there is no ZooKeeper to start: the
      # single node is both broker and controller.
      #
      # No --health-cmd. The image has no lightweight readiness probe that
      # works from Docker's shell, and a broker reports a listening socket well
      # before it will serve metadata; the wait step below asks the broker for
      # its API versions instead, which is the thing the client actually needs.
      kafka:
        image: apache/kafka:latest
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        ports:
          - 9092:9092
      # ClickHouse, so its sink is proven to move a record rather than assumed
      # to. CLICKHOUSE_SKIP_USER_SETUP leaves the default user password-less,
      # which is what makes an unauthenticated test connection work.
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 9000:9000
          - 8123:8123
      # Elasticsearch, so the bulk path is proven rather than assumed. Security
      # off and a small heap: this is a single-node cluster for one test file,
      # not a deployment.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
      # PostgreSQL with pgvector, separate from the postgres service above:
      # that one is stock and has no vector extension, and the CDC tests want
      # it left alone with its own wal_level and prepared-transaction settings.
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermod_it
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      # Azure SQL Edge rather than SQL Server: it is the variant with an arm64
      # image, which is what makes this connector testable on a developer
      # workstation as well as here. The T-SQL the sink emits is the same.
      mssql:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "1"
          MSSQL_SA_PASSWORD: Hermod!Passw0rd
        ports:
          - 1433:1433
      # Cassandra, arm64-capable and slow to start — the heap is held down
      # because the default sizing assumes a machine this is not.
      cassandra:
        image: cassandra:5
        env:
          CASSANDRA_CLUSTER_NAME: hermod
          HEAP_NEWSIZE: 128M
          MAX_HEAP_SIZE: 1G
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
        ports:
          - 9042:9042
    steps:
      # This job starts thirteen service containers and then builds the whole
      # tree with -race, and it ran the hosted runner out of disk:
      #
      #   ##[error]No space left on device : '.../_diag/pages/....log'
      #
      # It had passed on the commit before, so the job sits right at the edge
      # rather than over it — which is the worse failure, because it fails
      # intermittently for a reason that has nothing to do with the change being
      # tested, and a gate that goes red at random is one people learn to ignore.
      #
      # The runner image ships toolchains this repository never uses. Removing
      # them costs about half a minute and buys back tens of gigabytes, which is
      # a far better trade than dropping a service and testing less.
      # Only unused toolchains are removed. Deliberately left alone: the agent
      # tools directory, which is where setup-go installs Go two steps later,
      # and the Docker images, because the service containers are already
      # running on them by the time any step executes.
      - name: Free disk space on the runner
        run: |
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') available"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') available"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Two settings that are off by default and need a restart to take effect,
      # so they are applied together in one restart:
      #
      #   wal_level=logical            — CDC does nothing without logical decoding.
      #   max_prepared_transactions>0  — PREPARE TRANSACTION fails outright at 0,
      #                                  so the transactional sink group tests
      #                                  cannot run. They fail rather than skip
      #                                  when it is unset, deliberately: a silent
      #                                  skip on the only tests covering the
      #                                  prepared-transaction hazard would leave
      #                                  the suite green while covering nothing.
      - name: Enable logical replication and prepared transactions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET wal_level = logical;"
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_prepared_transactions = 32;"
          docker restart "$(docker ps -q --filter ancestor=postgres:16)"
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done
          test "$(psql -h localhost -U postgres -tAc "SHOW wal_level")" = "logical"
          test "$(psql -h localhost -U postgres -tAc "SHOW max_prepared_transactions")" -gt 0
      # The e2e recovery, retention and PgBouncer tests hardcode these database
      # names (see AGENTS.md); without them they fail on "database does not
      # exist" rather than testing anything.
      - name: Create the fixture databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in hermod_metadata hermod_test_source hermod_test_sink; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db;"
          done

      # Fails rather than continues if etcd never comes up: the contract would
      # otherwise fail nine clauses on connection errors, which is a slower and
      # less obvious way of saying the same thing.
      - name: Wait for etcd
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:2379/health | grep -q '"health":"true"'

      # Fails rather than continues if the broker never serves metadata. A
      # listening socket appears well before Kafka will answer a client, so
      # waiting on the port would hand the tests a broker that refuses them and
      # turn one clear failure into a screenful of confusing ones.
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 60); do
            if printf '' | nc -z 127.0.0.1 9092 2>/dev/null; then
              # Socket is up; now ask for metadata, which is what a client needs.
              if docker run --rm --network host apache/kafka:latest \
                  /opt/kafka/bin/kafka-broker-api-versions.sh \
                  --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1; then
                echo "kafka ready after ${i}s"; break
              fi
            fi
            if [ "$i" = 60 ]; then
              echo "kafka never became ready"; exit 1
            fi
            sleep 1
          done

      # MinIO by hand rather than as a service, for the same reason the replica
      # set below is: its entrypoint needs a `server` argument and a service
      # container has no way to pass one. Started on 9500 so it cannot collide
      # with ClickHouse's native port.
      - name: Start MinIO for the S3 sink
        run: |
          docker run -d --name minio -p 9500:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9500/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i}s"; break
            fi
            if [ "$i" = 60 ]; then
              echo "minio never became ready"; docker logs minio; exit 1
            fi
            sleep 1
          done

      # Mosquitto 2.x refuses remote connections without a config saying
      # otherwise, and a service block cannot override the command — so a
      # step, like MinIO above.
      - name: Start Mosquitto for the MQTT source
        run: |
          printf 'listener 1883\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --name mosquitto -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro \
            eclipse-mosquitto:2
          for i in $(seq 1 30); do
            # Exit 27 is "connected, no message within -W" — a healthy idle
            # broker. Anything meaning "could not connect" keeps waiting.
            #
            # `|| rc=$?` is load-bearing, not style: these steps run under
            # `bash -e`, where a *bare* command returning non-zero ends the
            # script on the spot. Written as `cmd` then `rc=$?`, the healthy
            # 27 killed the step before the assignment ever ran.
            rc=0
            docker exec mosquitto mosquitto_sub -t probe -C 1 -W 1 -h 127.0.0.1 >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ] || [ "$rc" = 27 ]; then
              echo "mosquitto ready after ${i}s"; break
            fi
            if [ "$i" = 30 ]; then
              echo "mosquitto never became ready (last rc=$rc)"; docker logs mosquitto; exit 1
            fi
            sleep 1
          done

      # The test keyspace. The sink does not create keyspaces and should not,
      # so the job makes the one the tests write into.
      - name: Create the Cassandra keyspace
        run: |
          for i in $(seq 1 40); do
            if docker exec "$(docker ps -q --filter ancestor=cassandra:5)" \
                cqlsh -e "CREATE KEYSPACE IF NOT EXISTS hermod_it WITH replication = {'class':'SimpleStrategy','replication_factor':1};" 2>/dev/null; then
              echo "keyspace ready after ${i} attempts"; break
            fi
            if [ "$i" = 40 ]; then echo "cassandra never accepted CQL"; exit 1; fi
            sleep 5
          done

      # A replica set, separate from the mongo service above.
      #
      # Change streams — which is all the MongoDB CDC source is — cannot run on
      # a standalone mongod, and a service container has no way to override the
      # command to pass --replSet. So this one is started by hand on another
      # port and handed over as MONGODB_RS_URI. The service container stays as
      # it is for every other MongoDB test.
      - name: Start a MongoDB replica set for change streams
        run: |
          docker run -d --name mongo-rs -p 27018:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'

      - name: Test (integration)
        env:
          HERMOD_INTEGRATION: "1"
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/hermod_it?sslmode=disable
          # Admission control sheds new workflows above 85% host CPU. A runner
          # executing the whole suite in parallel sits above that, so the worker
          # refused to start the workflow under test and the failover test timed
          # out waiting for a webhook that was never going to register. 1
          # disables the check (see README's admission knobs); shedding is
          # covered by internal/engine/worker/admission_test.go, which sets the
          # thresholds directly rather than through the environment.
          HERMOD_ADMISSION_CPU_THRESHOLD: "1"
          HERMOD_ADMISSION_MEM_THRESHOLD: "1"
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/hermod_it?parseTime=true
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_STREAM: hermod_it_stream
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: hermod_it
          ETCD_ENDPOINTS: 127.0.0.1:2379
          MONGODB_RS_URI: mongodb://127.0.0.1:27018/?directConnection=true
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_FROM: hermod@example.com
          SMTP_TO: ops@example.com
          SMTP_VERIFY_API: http://127.0.0.1:8025
          KAFKA_BROKERS: 127.0.0.1:9092
          CLICKHOUSE_ADDR: 127.0.0.1:9000
          ELASTICSEARCH_URL: http://127.0.0.1:9200
          S3_ENDPOINT: http://127.0.0.1:9500
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          PGVECTOR_DSN: postgres://postgres:postgres@127.0.0.1:5433/hermod_it?sslmode=disable
          MSSQL_DSN: sqlserver://sa:Hermod%21Passw0rd@127.0.0.1:1433?database=master&encrypt=disable
          CASSANDRA_HOSTS: 127.0.0.1
          MQTT_BROKER: tcp://127.0.0.1:1883
        # -race, and this job is the only place it can do any good: these tests
        # are the only ones that drive a connector against a live server, and
        # the concurrency that matters — a Close landing while a stream is
        # mid-read, or while an API request is still in flight — needs a real
        # connection to happen at all.
        #
        # Without it two data races in the PostgreSQL source sat here
        # indefinitely, one of them surfacing as an occasional failure in an
        # unrelated test that nobody could reproduce on demand. The unit suite
        # already runs with -race; this job did not, so a race in any connector
        # was invisible to CI by construction.
        #
        # The timeout goes up with it: -race costs roughly 2-5x in wall clock,
        # and a suite that starts timing out is a suite that gets its gate
        # removed.
        run: go test -tags=integration -race -count=1 -timeout 30m ./...

  # The browser E2E job that used to live here is gone, and so is the last spec
  # in it. production_grade.spec.ts was the only one left: its UI half was
  # already covered by multi_pipeline_editor_e2e and workflow_surface_e2e, and
  # the part that was not — that a sequential sink and a parallel sink both
  # deliver, with the field values to prove it — is now
  # internal/engine/registry/sink_delivery_models_integration_test.go.
  #
  # That move is the point. The spec needed a browser, Postgres and RabbitMQ,
  # took minutes, and ran continue-on-error on a nightly schedule, so a
  # regression in either sink model could merge with nothing going red. The Go
  # test runs in integration-go above, which is required, and finishes in under
  # a second. A required gate that runs on every push beats an informational one
  # that runs nightly and is ignored.

  soak:
    name: Soak (resource trends)
    runs-on: ubuntu-latest
    # Leaks are trends, not snapshots: the goroutine leak that motivated this
    # was invisible in a 30-second test and obvious across repeated cycles.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The one job that never got this, because it only runs on a schedule and
      # so was never in front of me while the other three were being fixed. It
      # builds the whole tree like they do, and it died at 14m25s with "the
      # runner has received a shutdown signal" — this repository's signature
      # for the runner agent being killed by resource exhaustion.
      - name: Free disk space on the runner
        run: |
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') available"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') available"
      - name: Soak (10 minutes)
        env:
          HERMOD_SOAK: "1"
          HERMOD_SOAK_DURATION: 10m
          # CI runners reap goroutines less eagerly than a laptop.
          HERMOD_SOAK_GOROUTINE_SLACK: "20"
        run: go test -v -run TestSoak -timeout 40m ./internal/engine/registry/

  lint-debt:
    name: Lint backlog (informational)
    runs-on: ubuntu-latest
    # The full lint surface, including everything that predates the current
    # config. Not a gate — a standing report so the debt stays visible and can
    # be paid down deliberately instead of being forgotten behind a green tick.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full lint report
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --new-from-merge-base="" --timeout=15m ./... || true
