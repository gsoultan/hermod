name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-publish an existing tag with the *current* workflow.
  #
  # A tag-triggered run executes the workflow file as it was at that tag, so a
  # bug in this file can only be fixed by cutting another tag -- which is how
  # v1.7.1 and v1.7.2 came to exist with binaries and no image. This lets a
  # release be retried from main after the fix.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.7.3
        required: true

permissions:
  contents: write
  packages: write

env:
  # The one place the version is decided. github.ref_name is the tag on a push
  # and the branch on a dispatch, so it cannot be used directly by both.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Is this tag a tombstone?
  #
  # A withdrawn version cannot be un-published from proxy.golang.org, so the
  # only way to stop `go get` selecting one is a `retract` directive -- and Go
  # reads retractions from the go.mod of the *highest* version, which means
  # retracting v1.7.3 requires publishing something above it. That tag exists to
  # carry the directive and for no other reason: it must not become a release,
  # must not take `latest`, and must not push an image, or it undoes the reset
  # it was cut to protect.
  #
  # A tombstone is self-describing rather than listed here: it retracts its own
  # version. Nothing else legitimately does that, and checking the tag's own
  # go.mod means a future tombstone needs no change to this file.
  tombstone:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Does this tag retract itself?
        id: check
        run: |
          skip=$(go mod edit -json \
            | jq -r --arg v "$RELEASE_TAG" '[.Retract // [] | .[] | select(.High == $v)] | length > 0')
          echo "tag=$RELEASE_TAG retracts-itself=$skip"
          if [ "$skip" = "true" ]; then
            echo "This tag retracts itself, so it is a tombstone: publishing nothing." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # Container image.
  #
  # goreleaser below produces binaries and archives only, so for a long time
  # there was no image at all — while the README documented Kubernetes probes
  # and a shutdown budget calibrated to terminationGracePeriodSeconds. Both
  # architectures match the goreleaser targets so a tag means the same thing
  # however you consume it.
  # One native runner per architecture, pushed by digest and merged into a
  # manifest afterwards.
  #
  # This was a single job building linux/amd64,linux/arm64 together. GitHub's
  # standard runners are amd64, so the arm64 half ran under QEMU -- compiling
  # the whole Go module and running the UI build a second time, emulated. It
  # took forty minutes, against five or six for the same image natively in CI.
  # A release that slow is one people put off cutting.
  #
  # ubuntu-24.04-arm is native and free for public repositories, so each half
  # now builds on its own architecture in parallel.
  image:
    needs: tombstone
    if: needs.tombstone.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Prepare platform name
        id: prep
        run: echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      # ghcr.io rejects an uppercase repository name. metadata-action lowercases
      # its own `images:` input, which is why the single-job build got away with
      # it -- but the push-by-digest `outputs:` below names the image directly
      # and does not, so "ghcr.io/gsoultan/Hermod" failed both architectures
      # with "repository name must be lowercase". Compute it once and use it
      # everywhere the name is written by hand.
      - name: Repository name, lowercased
        id: repo
        run: echo "name=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}

      # No tags here: each architecture is pushed by digest and the merge job
      # below is what attaches the tags. Tagging per-arch would leave whichever
      # finished last as the single-platform image behind :1.2.3.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}
          outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # The filename is the bare hex, with the sha256: prefix stripped: an
      # artifact path cannot contain a colon, and the merge step below adds the
      # prefix back when it builds the @sha256:... reference. Naming the file
      # with the raw digest failed both jobs *after* the image had already been
      # pushed, so the blobs were in the registry with nothing tagging them.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Repository name, lowercased
        id: repo
        run: echo "name=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.repo.outputs.name }}@sha256:%s ' *)

      # A manifest that exists is not the same as one that resolves. Fail here
      # rather than let someone discover it with a pull.
      - name: Verify the published manifest
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ steps.repo.outputs.name }}:${RELEASE_TAG#v}" \
            | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt
          grep -q "linux/arm64" /tmp/manifest.txt

  # Helm chart, published as an OCI artifact next to the image.
  #
  # appVersion is set from the tag so a chart always names the image it was cut
  # with; leaving it at the placeholder would install whatever :0.0.0 happened
  # to be.
  chart:
    runs-on: ubuntu-latest
    # The manifest, not the per-architecture builds: a chart published while
    # only one arch had landed would name a tag that does not resolve yet.
    needs: image-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          version="${RELEASE_TAG#v}"
          helm package deploy/helm/hermod \
            --version "$version" \
            --app-version "$version" \
            --destination dist
          helm push "dist/hermod-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

  goreleaser:
    needs: tombstone
    if: needs.tombstone.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: 'bun'
          cache-dependency-path: ui/bun.lock

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.7.3 and v1.7.3-rc.1 sat on the same commit, so git describe
          # picked the release candidate: goreleaser built 1.7.3-rc.1 artifacts
          # and failed uploading them to the rc's existing release. The image
          # jobs were unaffected because they read the triggering ref, not the
          # git history.
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
