name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Container image.
  #
  # goreleaser below produces binaries and archives only, so for a long time
  # there was no image at all — while the README documented Kubernetes probes
  # and a shutdown budget calibrated to terminationGracePeriodSeconds. Both
  # architectures match the goreleaser targets so a tag means the same thing
  # however you consume it.
  # One native runner per architecture, pushed by digest and merged into a
  # manifest afterwards.
  #
  # This was a single job building linux/amd64,linux/arm64 together. GitHub's
  # standard runners are amd64, so the arm64 half ran under QEMU -- compiling
  # the whole Go module and running the UI build a second time, emulated. It
  # took forty minutes, against five or six for the same image natively in CI.
  # A release that slow is one people put off cutting.
  #
  # ubuntu-24.04-arm is native and free for public repositories, so each half
  # now builds on its own architecture in parallel.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform name
        id: prep
        run: echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
        env:
          platform: ${{ matrix.platform }}

      # ghcr.io rejects an uppercase repository name. metadata-action lowercases
      # its own `images:` input, which is why the single-job build got away with
      # it -- but the push-by-digest `outputs:` below names the image directly
      # and does not, so "ghcr.io/gsoultan/Hermod" failed both architectures
      # with "repository name must be lowercase". Compute it once and use it
      # everywhere the name is written by hand.
      - name: Repository name, lowercased
        id: repo
        run: echo "name=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}

      # No tags here: each architecture is pushed by digest and the merge job
      # below is what attaches the tags. Tagging per-arch would leave whichever
      # finished last as the single-platform image behind :1.2.3.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}
          outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Repository name, lowercased
        id: repo
        run: echo "name=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ steps.repo.outputs.name }}@sha256:%s ' *)

      # A manifest that exists is not the same as one that resolves. Fail here
      # rather than let someone discover it with a pull.
      - name: Verify the published manifest
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ steps.repo.outputs.name }}:${GITHUB_REF_NAME#v}" \
            | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt
          grep -q "linux/arm64" /tmp/manifest.txt

  # Helm chart, published as an OCI artifact next to the image.
  #
  # appVersion is set from the tag so a chart always names the image it was cut
  # with; leaving it at the placeholder would install whatever :0.0.0 happened
  # to be.
  chart:
    runs-on: ubuntu-latest
    # The manifest, not the per-architecture builds: a chart published while
    # only one arch had landed would name a tag that does not resolve yet.
    needs: image-manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/hermod \
            --version "$version" \
            --app-version "$version" \
            --destination dist
          helm push "dist/hermod-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: 'bun'
          cache-dependency-path: ui/bun.lock

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
